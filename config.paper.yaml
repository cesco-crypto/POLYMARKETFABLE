# Paper-Betriebskonfiguration: Vollmarkt-Scan mit skaliertem Kapital.
# Start: python -m polybot.main run --config config.paper.yaml

mode: paper
# Vollmarkt-Scan-Tick live gemessen (Juli 2026): 45-70s (Gamma-Fenster-
# Pagination ~9.5k Märkte + Batch-Top-of-Book ~7k Tokens) — das Intervall
# muss darüber liegen, sonst warnt der Bot jeden Tick vor Überlauf.
poll_interval_s: 90

risk:
  paper_start_cash: 100000    # Start-Cash NUR beim ersten Anlegen des Portfolios
  # Limits mit dem Kapital mitskaliert (Verhältnisse wie beim 1k-Default):
  max_order_usdc: 500
  max_position_usdc: 2000
  max_total_exposure_usdc: 20000
  daily_loss_limit_usdc: 1000
  min_edge: 0.002             # Paper: auch kleine Edges mitnehmen (0.2 Cent)

strategy:
  enabled:
    - complement_arb
    - negrisk_arb
    - market_making
  # Market Making (vorsichtige Paper-Messung): Quotes NUR in den Top-10-
  # Märkten nach 24h-Volumen mit engem Spread (<= mm_spread), immer 1 Tick
  # hinter dem Best-Bid/Ask (nie aggressiv -> nur Maker-Fills). Rebate wird
  # tokenspezifisch simuliert (20% der Taker-Fee des Marktes).
  mm_size_usdc: 50
  mm_max_inventory_usdc: 500
  mm_max_markets: 10
  scan_all_markets: true      # ALLE aktiven Märkte scannen (max_markets ohne Wirkung)
  max_markets: 150            # nur relevant, falls scan_all_markets: false
  min_liquidity_usdc: 2000    # breiter scannen als im Beispiel (10k)
  min_volume_24h_usdc: 500
  min_order_shares: 5         # Polymarket-Mindestordergröße
  # Ehrliche Fill-Simulation: marketable Signale füllen erst im NÄCHSTEN
  # execute()-Tick gegen das dann aktuelle Buch — live vergehen zwischen
  # Signal und Order-Ankunft ~250ms (Erkennung + Order-RTT, Messung
  # 05.07.2026), 1 Stream-Tick ≈ 0.6s liegt konservativ darüber.
  # 0 = Sofort-Fill (altes, optimistisches Verhalten für Vergleichsmessungen).
  paper_fill_delay_ticks: 1
  # WebSocket-Streaming: zwischen den (langen) REST-Snapshots prüft ein
  # Inner-Loop alle stream_tick_s die live gestreamten Orderbücher der
  # Kandidaten-Tokens — Reaktionszeit in Millisekunden statt 90s. Fällt der
  # Stream aus, läuft der Bot unverändert über REST weiter.
  use_stream: true
  stream_tick_s: 0.5
  # 60s-Probeläufe 05.07.2026: 500 und 600 Abos -> 100% Buch-Abdeckung in
  # <10s; 800 und 1000 Abos -> nur 15-20% nach 60s (der Server deckelt die
  # book-Snapshots still zwischen 600 und 800). Deshalb bei 500 bleiben —
  # mehr Abos hießen WENIGER echte Bücher. Die Priorisierung (kurzlebige
  # Märkte zuerst, siehe stream_tokens) muss das Budget füllen, nicht Masse.
  stream_max_tokens: 500
