# LIVE-Konfiguration — Phase 1: Mikro-Kapital-Test.
#
# Ziel dieser Phase ist NICHT Gewinn, sondern die Messung der echten
# Capture-Quote (capture-report) mit minimalem Risiko. Erst wenn nach
# ~24-48h Live-Betrieb die Quote bekannt ist, werden Limits skaliert.
#
# Voraussetzungen (siehe README, Abschnitt Go-Live-Checkliste):
# - Rechtslage geklärt (Verantwortung liegt beim Betreiber)
# - Dediziertes Wallet NUR mit dem Testbudget (empfohlen: 300-500 USDC
#   als pUSD + etwas POL für Gas), niemals das Hauptwallet
# - POLY_PRIVATE_KEY (+ ggf. POLY_FUNDER_ADDRESS, POLY_SIGNATURE_TYPE)
#   als Umgebungsvariablen/Secrets — NIE in Dateien im Repo, NIE im Chat

mode: live
poll_interval_s: 90

risk:
  max_order_usdc: 6            # Mess-Sizing (Flotten-Befund 06.07.): kleiner
                               # als 20, damit der Kill-Switch (-30/Tag) einen
                               # ganzen Capture-Messtag mit Race-Verlusten
                               # überlebt statt nach wenigen Waisen zu greifen.
                               # Hochskalieren erst, wenn die Capture-Quote
                               # gemessen ist (Stufe 4 des Plans).
  max_position_usdc: 20
  max_total_exposure_usdc: 80
  daily_loss_limit_usdc: 30    # Kill-Switch: harter Tagesboden
  min_edge: 0.005              # live konservativer als Paper (0.002):
                               # Ausführungslatenz frisst kleine Edges
  paper_start_cash: 600       # knapp UNTER dem echten pUSD-Guthaben (602.94):
                              # der Cash-Deckungscheck gibt nie mehr frei als real da ist
  taker_fee_rate: 0.07
  flatten_orphan_grace_s: 60   # Waisen-Detektor: ungehedgte Einzelbeine nach
                               # 60s Schonfrist zum Bid verkaufen (Befund
                               # 05.07.: Delay-Races hinterlassen offene
                               # Richtungswetten). Frist > Poll-Fenster 15s.
  parallel_arb_legs: true      # P5 (Befund 07.07.): beide Arb-Beine gleichzeitig
                               # posten (Netzwerk parallel, Buchung seriell),
                               # damit Bein 2 nicht am FOK-Race scheitert und
                               # eine Waise (Verlustverkauf) hinterlässt.
  live_auto_merge: false       # AUS bis Merges als Deposit-Wallet-Batch laufen:
                               # die Token liegen nach dem V2-Flow im Deposit
                               # Wallet, ein Merge vom EOA würde nur fehlschlagen.
                               # Paare realisieren sich bis dahin bei Auflösung
                               # des Markts zu 1 USDC (Gewinn bleibt real, nur
                               # später liquide).

strategy:
  enabled:
    - complement_arb           # NUR die validierte Strategie in Phase 1
    # - negrisk_arb            # Phase 2, nachdem Capture-Quote bekannt ist
    # - market_making          # Phase 3
  scan_all_markets: true
  min_liquidity_usdc: 2000
  min_volume_24h_usdc: 500
  min_time_to_end_s: 300       # live noch defensiver als Paper (120s)
  arb_depth_margin: 1.5        # Survivability-Filter (Befund 07.07.): nur
                               # feuern, wenn BEIDE Ask-Level >= 1.5x unsere
                               # Größe tragen -> Bein 2 übersteht den Race eher,
                               # weniger Waisen/Bluten. Höher = noch defensiver.
  max_negrisk_events: 20
  max_negrisk_submarkets: 20
  use_stream: true
  stream_tick_s: 0.5
  stream_max_tokens: 500
